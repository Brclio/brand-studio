<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">编程思维到 Python 双卷学习路线</title>
  <desc id="desc">从编程思维、计算历史与算法出发，进入 Python 数据、流程控制与程序实践。</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
  </defs>
  <rect width="720" height="620" rx="34" fill="#fff8e8"/>
  <g filter="url(#paper)">
    <circle cx="588" cy="106" r="86" fill="#f4d758" opacity="0.24"/>
    <circle cx="104" cy="512" r="112" fill="#2b7fd8" opacity="0.08"/>
    <path d="M92 505 C136 408 94 282 205 236 C303 196 348 315 434 267 C520 218 475 116 613 110" fill="none" stroke="#2b7fd8" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 15"/>
    <path d="M92 505 C136 408 94 282 205 236 C303 196 348 315 434 267 C520 218 475 116 613 110" fill="none" stroke="#f4d758" stroke-width="16" stroke-linecap="round" opacity="0.16"/>

    <g transform="translate(75 470)">
      <circle cx="22" cy="22" r="22" fill="#e84a5f"/>
      <text x="22" y="28" text-anchor="middle" fill="#fefcf6" font-size="17" font-family="system-ui, sans-serif" font-weight="700">00</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">思维</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">WHY &amp; THINKING</text>
    </g>

    <g transform="translate(118 297)">
      <circle cx="22" cy="22" r="22" fill="#f4d758"/>
      <text x="22" y="28" text-anchor="middle" fill="#1a1a2e" font-size="17" font-family="system-ui, sans-serif" font-weight="700">01</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">历史</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">HISTORY &amp; IDEAS</text>
    </g>

    <g transform="translate(276 248)">
      <circle cx="22" cy="22" r="22" fill="#2b7fd8"/>
      <text x="22" y="28" text-anchor="middle" fill="#fefcf6" font-size="17" font-family="system-ui, sans-serif" font-weight="700">02</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">算法</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">ALGORITHMS</text>
    </g>

    <g transform="translate(420 248)">
      <circle cx="22" cy="22" r="22" fill="#e84a5f"/>
      <text x="22" y="28" text-anchor="middle" fill="#fefcf6" font-size="17" font-family="system-ui, sans-serif" font-weight="700">03</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">Python</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">DATA &amp; CONTROL</text>
    </g>

    <g transform="translate(483 145)">
      <circle cx="22" cy="22" r="22" fill="#f4d758"/>
      <text x="22" y="28" text-anchor="middle" fill="#1a1a2e" font-size="17" font-family="system-ui, sans-serif" font-weight="700">04</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">实践</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">FUNCTION &amp; CLASS</text>
    </g>

    <g transform="translate(536 65)">
      <circle cx="77" cy="45" r="42" fill="#2b7fd8"/>
      <path d="M61 45l11 11 23-26" fill="none" stroke="#fefcf6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
