      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">环境</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">GET READY</text>
    </g>

    <g transform="translate(118 297)">
      <circle cx="22" cy="22" r="22" fill="#f4d758"/>
