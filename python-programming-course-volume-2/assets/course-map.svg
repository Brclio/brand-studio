      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">数据</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">DATA TYPES</text>
    </g>

    <g transform="translate(276 248)">
      <circle cx="22" cy="22" r="22" fill="#2b7fd8"/>
      <text x="22" y="28" text-anchor="middle" fill="#fefcf6" font-size="17" font-family="system-ui, sans-serif" font-weight="700">02</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">逻辑</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">CONTROL FLOW</text>
    </g>

    <g transform="translate(420 248)">
      <circle cx="22" cy="22" r="22" fill="#e84a5f"/>
      <text x="22" y="28" text-anchor="middle" fill="#fefcf6" font-size="17" font-family="system-ui, sans-serif" font-weight="700">03</text>
      <text x="58" y="17" fill="#1a1a2e" font-size="21" font-family="system-ui, sans-serif" font-weight="700">抽象</text>
      <text x="58" y="39" fill="#4a4a5a" font-size="13" font-family="system-ui, sans-serif">FUNCTION &amp; CLASS</text>
