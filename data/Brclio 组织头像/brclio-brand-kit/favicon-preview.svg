<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Brclio favicon system preview</title>
  <desc id="desc">The Brclio favicon shown at large scale, browser-tab scale, and on light and dark surfaces.</desc>

  <rect width="1200" height="720" fill="#FEFCF6"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
    <rect x="56" y="48" width="164" height="34" rx="17" fill="#E84A5F"/>
    <text x="138" y="70" fill="#FEFCF6" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.5">BRCLIO · MARK</text>
    <text x="56" y="123" fill="#1A1A2E" font-size="38" font-weight="850">让记录成为一种被看见的光。</text>
    <text x="56" y="154" fill="#1A1A2E" opacity=".65" font-size="17">Favicon micro-mark · B × Clio × Scroll C</text>

    <!-- Hero mark -->
    <rect x="56" y="190" width="470" height="474" rx="30" fill="#2B7FD8"/>
    <circle cx="291" cy="422" r="177" fill="#FEFCF6" opacity=".12"/>
    <image href="favicon.svg" x="111" y="242" width="360" height="360"/>
    <rect x="92" y="612" width="398" height="1.5" fill="#FEFCF6" opacity=".4"/>
    <text x="92" y="642" fill="#FEFCF6" font-size="15" font-weight="650">PRIMARY MICRO-MARK</text>
    <text x="490" y="642" fill="#F4D758" font-size="15" font-weight="800" text-anchor="end">01</text>

    <!-- Browser tabs -->
    <text x="574" y="211" fill="#1A1A2E" font-size="15" font-weight="800" letter-spacing="1.2">BROWSER CONTEXT</text>
    <rect x="574" y="232" width="570" height="102" rx="20" fill="#FFFFFF" stroke="#1A1A2E" stroke-opacity=".10"/>
    <circle cx="610" cy="267" r="5" fill="#E84A5F"/>
    <circle cx="628" cy="267" r="5" fill="#F4D758"/>
    <circle cx="646" cy="267" r="5" fill="#2B7FD8"/>
    <rect x="682" y="249" width="274" height="54" rx="12" fill="#FEFCF6"/>
    <image href="favicon.svg" x="696" y="260" width="32" height="32"/>
    <text x="742" y="281" fill="#1A1A2E" font-size="14" font-weight="650">Brclio · 知识与创作档案</text>
    <text x="1125" y="281" fill="#1A1A2E" opacity=".38" font-size="20" text-anchor="end">+</text>

    <rect x="574" y="352" width="570" height="102" rx="20" fill="#1A1A2E"/>
    <circle cx="610" cy="387" r="5" fill="#E84A5F"/>
    <circle cx="628" cy="387" r="5" fill="#F4D758"/>
    <circle cx="646" cy="387" r="5" fill="#2B7FD8"/>
    <rect x="682" y="369" width="274" height="54" rx="12" fill="#29293F"/>
    <image href="favicon.svg" x="696" y="380" width="32" height="32"/>
    <text x="742" y="401" fill="#FEFCF6" font-size="14" font-weight="650">Brclio · 知识与创作档案</text>
    <text x="1125" y="401" fill="#FEFCF6" opacity=".45" font-size="20" text-anchor="end">+</text>

    <!-- Scale test -->
    <text x="574" y="506" fill="#1A1A2E" font-size="15" font-weight="800" letter-spacing="1.2">READABILITY SCALE</text>
    <rect x="574" y="527" width="570" height="137" rx="22" fill="#F4D758"/>
    <rect x="602" y="551" width="88" height="88" rx="18" fill="#FEFCF6"/>
    <image href="favicon.svg" x="614" y="563" width="64" height="64"/>
    <text x="646" y="656" fill="#1A1A2E" font-size="12" font-weight="800" text-anchor="middle">64 PX</text>

    <rect x="720" y="551" width="88" height="88" rx="18" fill="#FEFCF6"/>
    <image href="favicon.svg" x="748" y="579" width="32" height="32"/>
    <text x="764" y="656" fill="#1A1A2E" font-size="12" font-weight="800" text-anchor="middle">32 PX</text>

    <rect x="838" y="551" width="88" height="88" rx="18" fill="#FEFCF6"/>
    <image href="favicon-16x16.png" x="874" y="587" width="16" height="16"/>
    <text x="882" y="656" fill="#1A1A2E" font-size="12" font-weight="800" text-anchor="middle">16 PX</text>

    <path d="M978 571h130v48H978z" fill="#2B7FD8"/>
    <text x="1043" y="591" fill="#FEFCF6" font-size="12" font-weight="800" text-anchor="middle">CLARITY FIRST</text>
    <text x="1043" y="608" fill="#F4D758" font-size="11" font-weight="650" text-anchor="middle">NO TINY TEXTURE</text>
  </g>
</svg>
